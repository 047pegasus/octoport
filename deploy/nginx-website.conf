server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro emits directory-style routes (/docs/index.html).
    index index.html;

    # Hashed assets are immutable; HTML must always be revalidated so a deploy
    # is visible immediately rather than after a cache expires.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }
    location = /install.ps1 {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }
    location ~* \.(png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # TLS is terminated at Cloudflare, so no HSTS here - it is set at the edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
