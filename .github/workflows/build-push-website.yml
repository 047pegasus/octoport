# =============================================================================
# OctoPort website — build, test and push to GHCR.
#
# Trigger: pushes to `main` that touch anything under website/ (or this
# workflow / the Dockerfile / nginx config). Deployment is automatic via
# Watchtower (ghcr.io/047pegasus/octoport-website:latest).
#
# Uses only the built-in GITHUB_TOKEN for GHCR auth.
# =============================================================================

name: Build & Push website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "deploy/Dockerfile.website"
      - "deploy/nginx-website.conf"
      - ".github/workflows/build-push-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/047pegasus/octoport-website

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max