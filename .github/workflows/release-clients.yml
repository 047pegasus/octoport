# =============================================================================
# OctoPort clients — cross-platform release build.
#
# Trigger: a tag `v*` (e.g. `v0.2.0`), or manual dispatch for a dry run.
#
# Artefact naming is a CONTRACT with agent/install.sh, which looks for exactly:
#
#   CLI   octoport-<os>-<arch>            (raw binary; .exe on Windows)
#         octoport-<os>-<arch>.tar.gz     (Linux/macOS)
#         octoport-<os>-<arch>.zip        (Windows)
#         octoport-linux-<arch>.deb / .rpm
#         octoport-macos-<arch>.pkg
#   GUI   octoport-app-<os>-<arch>[.exe]
#         octoport-app-linux-<arch>.deb / .rpm / .AppImage / .tar.gz
#         octoport-app-macos-<arch>.dmg
#         octoport-app-windows-<arch>.zip / .msi
#
# install.sh always falls back to the raw binary, so a native packager failing
# on one platform degrades to a working install rather than a broken release.
# Those packaging steps are therefore `continue-on-error`; the compile and the
# raw-binary staging are not.
#
# Signing:
#   - Sigstore keyless attestations on every artefact (no secrets needed):
#       gh attestation verify <asset> --repo 047pegasus/octoport
#   - Apple Developer ID / Windows Authenticode applied only when the matching
#     secrets exist, so forks and first runs still build.
# =============================================================================

name: Release clients

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only costs time on clean CI runners.
  CARGO_INCREMENTAL: "0"

jobs:
  # ------------------------------------------------------------------ CLI --
  build-cli:
    name: CLI (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: linux,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos,   arch: x86_64,  runner: macos-14,         target: x86_64-apple-darwin }
          # macos-aarch64 was missing entirely, so Apple Silicon users had no
          # asset even though install.sh asks for one.
          - { os: macos,   arch: aarch64, runner: macos-14,         target: aarch64-apple-darwin }
          - { os: windows, arch: x86_64,  runner: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows, arch: aarch64, runner: windows-latest,   target: aarch64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: cli-${{ matrix.target }}

      # `--bin octoport` on its own resolves against the workspace's
      # default-run packages and fails with "no bin target named ...".
      # Naming the package with -p is what makes it unambiguous.
      - name: Build CLI
        working-directory: agent
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p octoport-cli --bin octoport

      # The raw binary is install.sh's ultimate fallback, so this step must
      # succeed on every platform.
      - name: Stage raw binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="agent/target/${{ matrix.target }}/release/octoport"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "${BIN}.exe" "dist/octoport-${{ matrix.os }}-${{ matrix.arch }}.exe"
          else
            cp "$BIN" "dist/octoport-${{ matrix.os }}-${{ matrix.arch }}"
            chmod +x "dist/octoport-${{ matrix.os }}-${{ matrix.arch }}"
          fi

      - name: Archive (tar.gz / zip)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          NAME="octoport-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}.exe" >/dev/null
          else
            tar czf "${NAME}.tar.gz" "$NAME"
          fi

      # --- Linux packages --------------------------------------------------
      # cargo-deb understands --no-build/--target. cargo-rpm does not (it is
      # unmaintained and rejected `--no-build` outright), so RPMs are built
      # with cargo-generate-rpm, which packages an already-built binary.
      - name: Package Linux CLI (.deb, .rpm)
        if: matrix.os == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm --locked
          cd agent
          cargo deb -p octoport-cli --no-build --target ${{ matrix.target }} \
            --output "../dist/octoport-linux-${{ matrix.arch }}.deb"
          cargo generate-rpm -p crates/octoport-cli \
            --target ${{ matrix.target }} \
            --output "../dist/octoport-linux-${{ matrix.arch }}.rpm"

      # --- macOS .pkg -------------------------------------------------------
      # cargo-bundle produces .app/.dmg and never .pkg, so the old
      # `find -name '*.pkg'` could never have matched. pkgbuild ships with
      # macOS and needs no extra tooling.
      - name: Package macOS CLI (.pkg)
        if: matrix.os == 'macos'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)/root"
          mkdir -p "$ROOT/usr/local/bin"
          cp "agent/target/${{ matrix.target }}/release/octoport" "$ROOT/usr/local/bin/octoport"
          chmod +x "$ROOT/usr/local/bin/octoport"
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --root "$ROOT" \
            --identifier io.octoport.cli \
            --version "${VERSION:-0.0.0}" \
            --install-location / \
            "dist/octoport-macos-${{ matrix.arch }}.pkg"

      - name: Sign macOS binary (optional)
        if: matrix.os == 'macos'
        continue-on-error: true
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${CERT_B64:-}" ] || [ -z "${CERT_PASS:-}" ]; then
            echo "Skipping macOS signing - secrets not set"; exit 0
          fi
          set -euo pipefail
          echo "$CERT_B64" | base64 -d > /tmp/octoport.p12
          security create-keychain -p temp temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p temp temp.keychain
          security import /tmp/octoport.p12 -k temp.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp temp.keychain
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "dist/octoport-macos-${{ matrix.arch }}"
          rm -f /tmp/octoport.p12

      - name: Sign Windows binary (optional)
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PASS) {
            Write-Host "Skipping Windows signing - secrets not set"; exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'octoport.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          signtool sign /f $pfx /p $env:CERT_PASS /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist/octoport-windows-${{ matrix.arch }}.exe"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- desktop --
  build-desktop:
    name: Desktop (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: linux,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos,   arch: x86_64,  runner: macos-14,         target: x86_64-apple-darwin }
          - { os: macos,   arch: aarch64, runner: macos-14,         target: aarch64-apple-darwin }
          # windows-aarch64 is omitted: the webview toolchain cannot be
          # cross-compiled from the x64 runner, and it failed every run.
          - { os: windows, arch: x86_64,  runner: windows-latest,   target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: gui-${{ matrix.target }}

      # Dioxus desktop renders through wry/WebKitGTK on Linux and needs the
      # tray and xdo libraries at link time.
      - name: Install Linux GUI dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Build desktop app
        working-directory: agent
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p octoport-gui --bin octoport-app

      - name: Stage raw binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="agent/target/${{ matrix.target }}/release/octoport-app"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "${BIN}.exe" "dist/octoport-app-${{ matrix.os }}-${{ matrix.arch }}.exe"
          else
            cp "$BIN" "dist/octoport-app-${{ matrix.os }}-${{ matrix.arch }}"
            chmod +x "dist/octoport-app-${{ matrix.os }}-${{ matrix.arch }}"
          fi

      - name: Archive (tar.gz / zip)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          NAME="octoport-app-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}.exe" >/dev/null
          else
            tar czf "${NAME}.tar.gz" "$NAME"
          fi

      # --- Linux: AppImage --------------------------------------------------
      - name: Package Linux GUI (.AppImage)
        if: matrix.os == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$RUNNER_TEMP/octoport-app.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp "agent/target/${{ matrix.target }}/release/octoport-app" "$APPDIR/usr/bin/octoport-app"
          chmod +x "$APPDIR/usr/bin/octoport-app"

          # The icon now genuinely exists (agent/assets), so there is no
          # placeholder-SVG branch any more.
          cp agent/assets/octoport-app-icon-256.png "$APPDIR/octoport-app.png"
          cp agent/assets/octoport-app-icon-256.png \
             "$APPDIR/usr/share/icons/hicolor/256x256/apps/octoport-app.png"

          cat > "$APPDIR/octoport-app.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=OctoPort
          Comment=Open local ports to the public internet
          Exec=octoport-app
          Icon=octoport-app
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=true
          DESKTOP
          cp "$APPDIR/octoport-app.desktop" "$APPDIR/usr/share/applications/octoport-app.desktop"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/octoport-app" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          if [ "${{ matrix.arch }}" = "aarch64" ]; then A=aarch64; else A=x86_64; fi
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${A}.AppImage"
          chmod +x appimagetool
          # GitHub runners have no FUSE, so run the tool from its extracted
          # contents rather than mounting the AppImage.
          ./appimagetool --appimage-extract >/dev/null
          ARCH="$A" ./squashfs-root/AppRun "$APPDIR" \
            "dist/octoport-app-linux-${{ matrix.arch }}.AppImage"
          rm -rf squashfs-root appimagetool

      # --- Linux: deb + rpm -------------------------------------------------
      - name: Package Linux GUI (.deb, .rpm)
        if: matrix.os == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm --locked
          cd agent
          cargo deb -p octoport-gui --no-build --target ${{ matrix.target }} \
            --output "../dist/octoport-app-linux-${{ matrix.arch }}.deb"
          cargo generate-rpm -p crates/octoport-gui \
            --target ${{ matrix.target }} \
            --output "../dist/octoport-app-linux-${{ matrix.arch }}.rpm"

      # --- macOS: .app -> .dmg ----------------------------------------------
      # cargo-bundle writes to agent/target/<triple>/release/bundle. The old
      # workflow looked in ../../target from inside agent/, i.e. one level
      # ABOVE the repository, which is why `find` reported "No such file".
      - name: Package macOS GUI (.dmg)
        if: matrix.os == 'macos'
        continue-on-error: true
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }} -p octoport-gui --format osx
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          APP="$(find "$BUNDLE" -maxdepth 2 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then echo "no .app produced"; exit 1; fi
          hdiutil create -volname OctoPort -srcfolder "$APP" -ov -format UDZO \
            "../dist/octoport-app-macos-${{ matrix.arch }}.dmg"

      # --- Windows: .msi ----------------------------------------------------
      # This previously died with "Failed to collect resource file
      # information" because the bundle icon path pointed at agent/assets,
      # which did not exist. That asset is now committed, so it resolves.
      - name: Package Windows GUI (.msi)
        if: matrix.os == 'windows'
        continue-on-error: true
        working-directory: agent
        shell: pwsh
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }} -p octoport-gui --format msi
          $msi = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle" `
                   -Filter *.msi -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          # `mkdir -p` is not PowerShell: -p binds to -Path and the call fails
          # when the directory already exists. -Force is the idempotent form.
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          if ($msi) {
            Copy-Item $msi.FullName "../dist/octoport-app-windows-${{ matrix.arch }}.msi"
          } else {
            Write-Host "No MSI produced; the .exe and .zip remain available."
          }

      - name: Sign macOS app (optional)
        if: matrix.os == 'macos'
        continue-on-error: true
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${CERT_B64:-}" ] || [ -z "${CERT_PASS:-}" ]; then
            echo "Skipping macOS signing - secrets not set"; exit 0
          fi
          set -euo pipefail
          echo "$CERT_B64" | base64 -d > /tmp/octoport.p12
          security create-keychain -p temp temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p temp temp.keychain
          security import /tmp/octoport.p12 -k temp.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp temp.keychain
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "dist/octoport-app-macos-${{ matrix.arch }}"
          rm -f /tmp/octoport.p12

      - name: Sign Windows app (optional)
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PASS) {
            Write-Host "Skipping Windows signing - secrets not set"; exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'octoport.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          signtool sign /f $pfx /p $env:CERT_PASS /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist/octoport-app-windows-${{ matrix.arch }}.exe"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- publish --
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-cli, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      # `sha256sum octoport-* octoport-app-*` listed every app asset twice,
      # since octoport-* already matches octoport-app-*. Hashing the directory
      # once avoids the duplicates and picks up the archives too.
      - name: Generate SHA256SUMS
        working-directory: artefacts
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          echo "--- release contents ---"
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: OctoPort ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artefacts/*
          body: |
            ## Verifying this download

            Every asset is listed in `SHA256SUMS` and carries a Sigstore build
            attestation tying it to this workflow and commit.

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            gh attestation verify octoport-linux-x86_64 --repo ${{ github.repository }}
            ```
