# =============================================================================
# OctoPort control plane — build, vet, test and push to GHCR.
#
# Trigger: pushes to `main` that touch anything under control-plane/ (or this
# workflow / the Dockerfile). Deployment itself is automatic: Watchtower on the
# home server watches ghcr.io/047pegasus/octoport-control-plane:latest and
# recreates the container. No SSH, no server secrets.
#
# Uses only the built-in GITHUB_TOKEN for GHCR auth.
# =============================================================================

name: Build & Push control plane

on:
  push:
    branches:
      - main
    paths:
      - "control-plane/**"
      - "deploy/Dockerfile.control-plane"
      - ".github/workflows/build-push-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/047pegasus/octoport-control-plane

jobs:
  vet-and-test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: control-plane/go.mod

      - name: Vet
        working-directory: control-plane
        run: go vet ./...

      - name: Test
        working-directory: control-plane
        run: go test ./...

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: vet-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.control-plane
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max